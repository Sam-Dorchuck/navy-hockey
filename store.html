<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Store — Navy Hockey</title>
<meta name="description" content="Navy Hockey gear for players, families and fans.">
<link rel="icon" href="img/navy-n-star.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body data-page="store">
<div id="site-header"></div>

<main id="top">
  <div class="pagehead">
    <div class="shell">
      <div class="kicker">Team store</div>
      <h1>Wear the N&#9733;</h1>
      <p>Navy Hockey gear for players, families, and fans. Pick your gear on the order form and we'll email you to confirm sizes, your total, and payment.</p>
    </div>
  </div>

<section id="merch">
    <div class="shell">
      <div class="wall wall-merch" id="merch-grid"></div>
      <div class="order">
        <div>
          <h3>How to order</h3>
          <p id="order-copy" style="color:var(--rink);margin:.6rem 0 0"></p>
        </div>
        <div id="order-cta"></div>
      </div>
    </div>
  </section>
</main>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-panel">
    <button class="sheet-close" aria-label="Close">&#10005;</button>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
</body>
</html>
